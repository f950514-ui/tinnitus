<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>耳鳴與地震紀錄</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--card:#fff;--mut:#667085;--ac:#2f6fed;--bd:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaee;--card:#1e2126;--mut:#9aa3b2;--ac:#6c9bff;--bd:#2d323a}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaee;--card:#1e2126;--mut:#9aa3b2;--ac:#6c9bff;--bd:#2d323a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font-size:15px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.big{width:100%;padding:18px;font-size:18px;background:var(--ac);color:#fff;border:0;border-radius:12px}
button.s{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px}
input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.mut{color:var(--mut);font-size:14px}
.list{max-height:240px;overflow-y:auto}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:15px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.warn{background:rgba(240,160,0,.12);border:1px solid rgba(240,160,0,.5);border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.res{font-size:15px}
</style></head><body><main>
<h1>👂 耳鳴 × 地震 紀錄器</h1>
<nav id="nav"></nav>

<section id="t0">
 <div class="card">
  <button class="big" id="now">🔔 現在耳鳴了(記錄此刻)</button>
  <label>或補記過去的時間</label>
  <div class="row"><input type="datetime-local" id="dt"><select id="lv"><option value="1">輕微</option><option value="2" selected>中等</option><option value="3">嚴重</option></select></div>
  <button class="s" id="add" style="margin-top:8px;width:100%">新增這筆</button>
 </div>
 <div class="card"><b>耳鳴紀錄 <span id="tc"></span></b><div class="list" id="tl"></div></div>
</section>

<section id="t1" hidden>
 <div class="card">
  <b>匯入地震資料</b>
  <p class="mut">從中央氣象署「地震活動彙整」下載或複製清單後貼上,每行需含「日期時間」和「規模」,例如:<br>2026-09-20 14:32:10, 4.8</p>
  <textarea id="csv" rows="6" placeholder="貼上地震清單…"></textarea>
  <button class="s" id="imp" style="margin-top:8px;width:100%">匯入</button>
  <p class="mut" id="impmsg"></p>
  <label>或手動新增一筆</label>
  <div class="row"><input type="datetime-local" id="qdt"><input type="number" step="0.1" id="qm" placeholder="規模"></div>
  <button class="s" id="qadd" style="margin-top:8px;width:100%">新增地震</button>
 </div>
 <div class="card"><b>地震資料 <span id="qc"></span></b><div class="list" id="ql"></div></div>
</section>

<section id="t2" hidden>
 <div class="card">
  <div class="row"><div><label>耳鳴後幾小時內</label><input type="number" id="win" value="48" min="1"></div>
  <div><label>地震規模 ≥</label><input type="number" id="mag" value="4" step="0.1"></div></div>
  <button class="s" id="run" style="margin-top:10px;width:100%">開始分析</button>
 </div>
 <div class="warn">⚠️ 目前沒有可靠的科學證據顯示耳鳴能預測地震。台灣地震頻繁,「耳鳴後剛好有地震」很容易是巧合,所以本工具會拿「隨機時間點」當對照組比較。</div>
 <div id="out"></div>
</section>

<section id="t3" hidden>
 <div class="card"><b>備份</b>
  <button class="s" id="exp" style="width:100%;margin:8px 0">複製備份資料</button>
  <textarea id="bk" rows="4" placeholder="還原:貼上備份資料後按下方按鈕"></textarea>
  <button class="s" id="rest" style="width:100%;margin-top:8px">還原</button>
  <button class="s" id="clr" style="width:100%;margin-top:8px">清除全部資料</button>
 </div>
</section>

<script>
var T=[],Q=[];
function load(){try{var d=JSON.parse(localStorage.getItem("tq")||"{}");T=d.T||[];Q=d.Q||[]}catch(e){}}
function save(){try{localStorage.setItem("tq",JSON.stringify({T:T,Q:Q}))}catch(e){}}
load();
var $=function(i){return document.getElementById(i)};
var names=["耳鳴","地震","分析","備份"];
names.forEach(function(n,i){var b=document.createElement("button");b.textContent=n;b.onclick=function(){show(i)};$("nav").appendChild(b)});
function show(k){for(var i=0;i<4;i++){$("t"+i).hidden=i!==k;$("nav").children[i].className=i===k?"on":""}if(k===2)$("out").innerHTML=""}
show(0);
function f(ms){var d=new Date(ms),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
function render(){
 T.sort(function(a,b){return b.t-a.t});Q.sort(function(a,b){return b.t-a.t});
 $("tc").textContent="("+T.length+")";$("qc").textContent="("+Q.length+")";
 $("tl").innerHTML=T.map(function(x,i){return '<div class="it"><span>'+f(x.t)+' · '+["","輕","中","重"][x.l]+'</span><button class="s" onclick="delT('+i+')">刪</button></div>'}).join("")||'<p class="mut">還沒有紀錄</p>';
 $("ql").innerHTML=Q.slice(0,200).map(function(x,i){return '<div class="it"><span>'+f(x.t)+' · M'+x.m+'</span><button class="s" onclick="delQ('+i+')">刪</button></div>'}).join("")||'<p class="mut">還沒有資料</p>';
}
function delT(i){T.splice(i,1);save();render()}
function delQ(i){Q.splice(i,1);save();render()}
$("now").onclick=function(){T.push({t:Date.now(),l:+$("lv").value});save();render()};
$("add").onclick=function(){if(!$("dt").value)return;T.push({t:new Date($("dt").value).getTime(),l:+$("lv").value});save();render()};
$("qadd").onclick=function(){var m=parseFloat($("qm").value);if(!$("qdt").value||isNaN(m))return;Q.push({t:new Date($("qdt").value).getTime(),m:m});save();render()};
$("imp").onclick=function(){
 var n=0,seen={};Q.forEach(function(q){seen[q.t+"_"+q.m]=1});
 $("csv").value.split(/\r?\n/).forEach(function(line){
  var r=line.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[ T]+(\d{1,2}):(\d{2})/);if(!r)return;
  var rest=line.replace(r[0],"");var m=rest.match(/\d+\.\d+|\b\d\b/);if(!m)return;
  var t=new Date(+r[1],r[2]-1,+r[3],+r[4],+r[5]).getTime(),mg=parseFloat(m[0]);
  if(seen[t+"_"+mg])return;seen[t+"_"+mg]=1;Q.push({t:t,m:mg});n++});
 save();render();$("impmsg").textContent="已匯入 "+n+" 筆";$("csv").value="";
};
$("run").onclick=function(){
 var W=(+$("win").value||48)*3600e3,M=+$("mag").value;
 if(T.length<2){$("out").innerHTML='<div class="card">請先記錄至少 2 筆耳鳴。</div>';return}
 var qs=Q.filter(function(q){return q.m>=M}).map(function(q){return q.t}).sort(function(a,b){return a-b});
 var t0=Math.min.apply(null,T.map(function(x){return x.t})),t1=Math.max.apply(null,T.map(function(x){return x.t}));
 var lastQ=Q.length?Math.max.apply(null,Q.map(function(q){return q.t})):0;
 function hit(t){for(var i=0;i<qs.length;i++){if(qs[i]>t&&qs[i]<=t+W)return qs[i]-t}return null}
 var ev=T.filter(function(x){return x.t+W<=lastQ});
 if(!ev.length){$("out").innerHTML='<div class="card">地震資料尚未涵蓋耳鳴之後的時間,請匯入更新的地震資料。</div>';return}
 var hits=0,leads=[];ev.forEach(function(x){var h=hit(x.t);if(h!==null){hits++;leads.push(h/3600e3)}});
 var tot=0,bh=0;for(var t=t0;t<=Math.min(t1,lastQ-W);t+=1800e3){tot++;if(hit(t)!==null)bh++}
 var p1=hits/ev.length,p0=tot?bh/tot:0,ratio=p0>0?(p1/p0):null;
 leads.sort(function(a,b){return a-b});var med=leads.length?leads[Math.floor(leads.length/2)]:null;
 // 規模逐級比較
 var rows=[3,4,5,6].map(function(m){var s=Q.filter(function(q){return q.m>=m}).map(function(q){return q.t}).sort(function(a,b){return a-b});
  function h2(t){for(var i=0;i<s.length;i++){if(s[i]>t&&s[i]<=t+W)return true}return false}
  var a=0;ev.forEach(function(x){if(h2(x.t))a++});var n=0,b=0;for(var t=t0;t<=Math.min(t1,lastQ-W);t+=1800e3){n++;if(h2(t))b++}
  var pa=ev.length?a/ev.length:0,pb=n?b/n:0;return '<tr><td>≥'+m+'</td><td>'+Math.round(pa*100)+'% ('+a+'/'+ev.length+')</td><td>'+Math.round(pb*100)+'%</td><td>'+(pb>0?(pa/pb).toFixed(2)+'×':'-')+'</td></tr>'}).join("");
 var verdict=ev.length<30?"樣本還太少(建議至少 30 筆耳鳴),結果不具參考價值。":ratio===null?"對照組沒有地震,無法比較。":ratio>1.5?"耳鳴後的地震比例明顯高於隨機,值得持續記錄觀察,但仍不代表因果。":"耳鳴後的地震比例與隨機差不多,目前看不出關聯。";
 $("out").innerHTML='<div class="card res"><b>耳鳴後 '+(W/3600e3)+' 小時內有 M'+M+'+ 地震</b><p>實際:<b>'+Math.round(p1*100)+'%</b>('+hits+'/'+ev.length+' 次耳鳴)<br>隨機對照:<b>'+Math.round(p0*100)+'%</b><br>倍數:<b>'+(ratio===null?"-":ratio.toFixed(2)+"×")+'</b>'+(med!==null?'<br>地震中位數發生在耳鳴後 '+med.toFixed(1)+' 小時':'')+'</p><p>'+verdict+'</p></div><div class="card"><b>各規模門檻比較</b><div class="tbl"><table><tr><th>規模</th><th>耳鳴後</th><th>隨機</th><th>倍數</th></tr>'+rows+'</table></div></div>';
};
$("exp").onclick=function(){var s=JSON.stringify({T:T,Q:Q});$("bk").value=s;try{navigator.clipboard.writeText(s)}catch(e){}$("bk").select()};
$("rest").onclick=function(){try{var d=JSON.parse($("bk").value);T=d.T||[];Q=d.Q||[];save();render()}catch(e){alert("格式不正確")}};
$("clr").onclick=function(){if(confirm("確定清除全部資料?")){T=[];Q=[];save();render()}};

render();
</script></main></body></html>
